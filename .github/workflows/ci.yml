name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project with workflow and dev dependencies
        run: python -m pip install -e .[dev,paired]

      - name: Run smoke and method regression tests
        run: pytest -q

      - name: Run release validation chain
        run: python dev/release_check.py --work-root "${{ runner.temp }}/draft-release-check"
