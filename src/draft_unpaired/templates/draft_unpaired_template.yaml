# Unpaired RNA/ATAC (different cells, labelled with the same tree nodes) with TF-RE and RE-TG priors,
# in the lineage folder layout of the README.
config_version: 2
lineage: lineage1
base_dir: .
lineage_data_dir: data/${lineage}
result_root: result/${lineage}
data:
  rna_h5ad: ${lineage_data_dir}/rna.h5ad
  rna_layer: lognorm  # Preferred layer; falls back to X. null selects X.
  atac_h5ad: ${lineage_data_dir}/atac.h5ad
  atac_layer: counts
  annotation: null  # RNA cell labels from obs cell_type, or ${lineage_data_dir}/rna_cells.tsv.
  atac_annotation: null  # ATAC cell labels from obs cell_type, or ${lineage_data_dir}/atac_cells.tsv.
  tree: ${lineage_data_dir}/tree.tsv
  tf_list: ${lineage_data_dir}/TF.tsv
  tg_list: ${lineage_data_dir}/TG.tsv
  tf_re_prior: ${lineage_data_dir}/TF_RE.tsv
  re_tg_prior: ${lineage_data_dir}/RE_TG.tsv
  prior_score_threshold: 0.1
prior_preparation:
  enabled: true
  method: accessible_peak_path
  min_accessible_fraction: null  # Set the peak-accessibility fraction for your data.
output_dir: ${result_root}/train
model:
  hidden_channels: 64
  out_channels: 64
  dropout_rate: 0.4
  gat_heads: 2
training:
  seed: 4412
  neg_sampling_ratio: 1.0
  num_epochs: 600
  lr: 2e-4
  weight_decay: 1e-3
  auto_lambda_smooth: true
  lambda_smooth_init: 300.0
  branch_weight_scales: null
  log_every: 10
artifacts:
  dir: ${result_root}/train/artifacts
  filename: ${lineage}_graphs.pt
checkpoints:
  dir: ${result_root}/model
reproduce:
  output_dir: ${result_root}/reproduce
  artifact_path: ${result_root}/train/artifacts/${lineage}_graphs.pt
  checkpoint_pattern: '*.pt'
  save_embeddings: true
  smoothness:
    save_heatmap: true
network:
  output_dir: ${result_root}/network
  active_frac_tf_tg: 0.3
  top_k_global: 50000
  min_score_keep: 0.85
  m_min: 0
  m_max: 5000
  gamma: 10.0
  eps: 1.0e-12
  dense:
    output_dir: ${result_root}/network_dense
    n_interp: 4
    sigma_time: 0.7
    active_thr: 0.3
    min_score_keep: 0.85
    top_k_global: 50000
    rescue_gamma: 10.0
    rescue_m_min: 0
    rescue_m_max: 5000
    rescue_eps: 1.0e-08
    use_one_based: false
    keep_id_cols: true
    add_prefix: false
single_tf:
  enabled: false
  output_dir: ${result_root}/single_tf
  tf_symbols: []
  centrality_mode: topk_sum
  topk: 500
  threshold: 0.5
  min_expr_frac: 0.1
  max_expr_frac: 0.8
  time_for_top: 0
  topn_tg: 50
  user_thresh: 0.2
  consensus:
    enabled: false
    time_points:
    - 0
    - 1
    - 2
    - 3
    rank_method: geometric_mean
    topn: 20
edge_cluster:
  enabled: false
  network_dir: ${result_root}/network
  output_dir: ${result_root}/edge_cluster
  selection_mode: all
  top_n_per_cluster: 10000
  score_threshold: 0.9
  n_clusters: 12
  random_state: 5465
  save_fig: true
topic:
  enabled: false
  network_dir: ${result_root}/network
  output_dir: ${result_root}/topic
  selection_mode: all
  top_n_per_cluster: 10000
  score_threshold: 0.99
  n_topics: 10
  lda_max_iter: 200
  lda_learning_method: batch
  do_enrich: false
  enrich_db: null
  enrich_organism: null
  enrich_background: network_targets
continuous_activity:
  enabled: false
  network_dir: ${result_root}/network_dense
  output_dir: ${result_root}/continuous_activity
  tf_list: []
  sigma_time: 0.5
pipeline:
  output_dir: ${result_root}/pipeline
