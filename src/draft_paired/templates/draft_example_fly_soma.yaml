lineage: lineage1
lineage_data_dir: data/raw/soma
result_root: result/fly_soma
output_dir: ${result_root}/train
data:
  tf_list: data/raw/TF.tsv
  tg_list: data/raw/TG.tsv
  re_list: data/raw/RE.txt
  rna_h5ad: ${lineage_data_dir}/soma_rna.h5ad
  atac_h5ad: ${lineage_data_dir}/soma_atac.h5ad
  tf_re_prior: data/raw/TF_RE_top3pct_edges.tsv
  re_tg_prior: data/raw/RE_TG_100kb.tsv
  annotation: ${lineage_data_dir}/soma_cell_annotation.csv
  tree: ${lineage_data_dir}/soma_tree.csv
model:
  hidden_channels: 64
  out_channels: 64
  dropout_rate: 0.4
  gat_heads: 2
training:
  seed: 2025
  neg_sampling_ratio: 1.0
  dedup_neg: true
  num_epochs: 600
  checkpoint_selection: best_loss
  weight_decay: 1e-5
  auto_lambda_smooth: true
  lambda_smooth_init: 0.0
  log_every: 10
  lr: 0.0003
artifacts:
  dir: ${result_root}/train/artifacts
  filename: fly_soma_graphs.pt
checkpoints:
  dir: ${result_root}/model
reproduce:
  output_dir: ${result_root}/reproduce
  artifact_path: ${result_root}/train/artifacts/fly_soma_graphs.pt
  checkpoint_pattern: '*.pt'
  save_embeddings: true
  smoothness:
    row_bs: 1024
    col_bs: 4096
    save_heatmap: true
network:
  output_dir: ${result_root}/network
  tf_filter_file: data/raw/TF_filtered.tsv
  active_frac_tf_tg: 0.05
  active_frac_re: 0.05
  top_k_global: 10000
  min_score_keep: 0.83
  m_min: 0
  m_max: 2000
  gamma: 3.0
  eps: 1.0e-12
  topn_re_per_tg: 2
  max_dist_bp: 250000
  dist_lambda: 50000.0
  w_re_tg: 0.4
  w_dist: 0.3
  w_tf_re: 0.2
  w_act: 0.1
  strict_score_mode: score_cos_prob
  dense:
    output_dir: ${result_root}/network_dense
    n_interp: 4
    sigma_time: 0.7
    active_thr: 0.05
    min_score_keep: 0.82
    top_k_global: 50000
    rescue_gamma: 4.0
    rescue_m_min: 0
    rescue_m_max: 0
    rescue_eps: 1.0e-08
    use_one_based: false
    keep_id_cols: true
    add_prefix: false
single_tf:
  enabled: true
  output_dir: ${result_root}/single_tf
  tf_symbols:
  - ovo
  time_for_top: 0
  topn_tg: 50
  consensus:
    enabled: false
    time_points:
    - 0
    - 1
    - 2
    - 3
    rank_method: geometric_mean
    topn: 20
  max_expr_frac: 0.8
continuous_activity:
  enabled: true
  network_dir: ${result_root}/network_dense
  output_dir: ${result_root}/continuous_activity
  tf_list:
  - ovo
  sigma_time: 0.5
edge_cluster:
  enabled: true
  network_dir: ${result_root}/network
  output_dir: ${result_root}/edge_cluster
  selection_mode: topk
  top_n_per_cluster: 10000
  n_clusters: 12
topic:
  enabled: true
  network_dir: ${result_root}/network
  output_dir: ${result_root}/topic
  selection_mode: topk
  top_n_per_cluster: 10000
  n_topics: 12
  do_enrich: false
  enrich_db: GO_Biological_Process_2018
  enrich_organism: Fly
  enrich_background: null
pipeline:
  output_dir: ${result_root}/pipeline
method_profile:
  name: methods
config_version: 2
application_profile: fly_soma
