# Network inference from bundled simulated RNA/ATAC data.
lineage: simulation_9plus3
simulation:
  data_seeds: [101, 102, 103]
  model_seeds: [0, 1, 2, 3, 4]
  data_dir: null  # Use bundled observations and candidate priors.
  output_dir: result/simulation
  module_attention_beta: 0.0
  device: cpu
  threads: 8
  evaluate: true
  save_figures: true
model:
  hidden_channels: 32
  out_channels: 32
  dropout_rate: 0.40
  gat_heads: 2
training:
  num_epochs: 600
  lr: 0.001
  lr_decay_start: 560
  lr_decay_end: 800
  final_lr: 0.0001
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  checkpoint_selection: last
  smooth_weight: 0.0
  reconstruction_reduction: mean
  log_every: 50
